<!DOCTYPE html>
<html class="">
	<head>
		<title>Labeling Creator</title>
		<meta charset='utf-8' />

		<!-- STYLESHEETS -->
		<link rel='stylesheet' type='text/css' href='creator.css'>
		<link rel='stylesheet' type='text/css' href='https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.10.4/css/jquery.ui.resizable.min.css'>
		<link href='//fonts.googleapis.com/css?family=Anybody:300,400,700|Roboto+Slab' rel='stylesheet' type='text/css'>

		<!-- REQUIRED MATERIA JAVASCRIPT -->
		<script src="materia.creatorcore.js"></script>

		<!-- YOUR PREREQUISITES -->
		<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		<script src='//cdnjs.cloudflare.com/ajax/libs/jqueryui/1.10.4/jquery-ui.min.js'></script>

		<!-- MAIN CREATOR SCRIPT -->
		<script src="creator.js"></script>
	</head>
	<body>
		<!-- <div class='sidepanel left'></div>
		<div class='sidepanel right'></div> -->

		<div class='frame' id='frame'>
			<div id='header'>
				<div class='logo'></div>
				<h1 id='title'></h1>
				<div class="link">
					<img src="../assets/pencil.png" alt="Edit widget name" class="link-icon"></div>
			</div>

			<div class="arrow_box hide">Add Image Description</div>

			<div id='controls'>
				<div id="background-settings" class="color-picker">
					<label class="label-title">Background Settings</label>
					<div class="background-options">
						<input type="radio" id="darktone-toggle" name="background-tone" checked>
						<label for="darktone-toggle" class="swatch dark1"></label>
					
						<input type="radio" id="darktone2-toggle" name="background-tone">
						<label for="darktone2-toggle" class="swatch dark2"></label>
			
						<input type="radio" id="midtone-toggle" name="background-tone">
						<label for="midtone-toggle" class="swatch mid"></label>
				
						<input type="radio" id="lighttone-toggle" name="background-tone">
						<label for="lighttone-toggle" class="swatch light"></label>
					</div>
				</div>
				<hr>
				<div id="label-settings">
					<label class="label-title">Label Settings</label>
					<label class="label-subtitle">Color Scheme</label>
				  
					<div class="label-options">
					  <input type="radio" id="darktone-toggle" name="label-toggle" value="opaque" checked>
					  <label for="darktone" class="label-box dark1">Aa</label>
				  
					  <input type="radio" id="midtone-toggle" name="label-toggle" value="frosted">
					  <label for="midtone" class="label-box mid">Aa</label>
				  
					  <input type="radio" id="lighttone-toggle" name="label-toggle" value="transparent">
					  <label for="lighttone" class="label-box light">Aa</label>
					</div>
				</div>
				<hr>
				<div id="anchor-settings">
					<label class="label-title">Anchor Settings</label>
					<div id="opacity-number">
						<label class="label-subtitle">Opacity | </label>
						<span id="opacity-value"> 100%</span>
					</div>
					<input
						type="range"
						id="opacity-slider"
						min="0"
						max="100"
						step="1"
						value="100"
					>
				</div>
				<hr>
				<div id="image-settings">
					<label class="label-title">Image Settings</label>
					<label class="label-subtitle">Edit Image</label>
					<div id="edit-image">
						<input type='button' value='Choose a different image' data-intro='Choose an image' id='btnChooseImage'>
						<input type='button' id='btnMoveCrop'>
						<input type='button' id='btnMoveResize'>
					</div>
					<label class="label-subtitle2">Image Description</label>
					<div id="image-desc">
						<p id="imagedescription"></p>
						<button id='btnChangeDescription'>
							<img src="assets/pencil.svg"/>
						</button>
					</div>		
				</div>
			</div>

			<div id='backgroundcover'></div>
			<div id='controlcover'></div>
			<!-- <input type='button' value='Cancel Move &amp; Resize' id='btnMoveResizeCancel' style='display:none'>
			<input type='button' value='Save Changes' id='btnMoveResizeDone' style='display:none'> -->

			<div id="board" class="screen board">
				<div id='boardcover'></div>
				<div id='imagewrapper'>
					<!-- <div id="chooseimage" style='display:none'>Click "Choose a different image" to select an image</div> -->
					<img id='image' alt=''>
					<div id='inputwrapper'>
						<div id='resizecontrols'>
							<button aria-label="Cancel Move & Resize" id="btnMoveResizeCancel"><img src="assets/x.svg"/></button>
							<div style="background: #fff; width: 1px;"></div>
							<button aria-label="Save Changes" id="btnMoveResizeDone"><img src="assets/check.svg"/></button>
						</div>
					</div>
				</div>
				<canvas id='canvas'></canvas>
				<div id='terms'>
					<template id="term_template"><div><h3 class="label-title-header">Create Label</h3><div class='label-title-header'>Label Title</div><div class='label-input' id='text-input' tabindex='0' contenteditable='true' onkeypress='return (this.innerText.length <= 400)'></div><div class='alt-text-header'>Label Description</div><div class='description-input' id='text-input' contenteditable='true' tabindex='0' onkeypress='return (this.innerText.length <= 400)'></div><div class='delete'><img src="assets/x.svg"/></div><div class='confirm'><img src="assets/check.svg"/></div><div class='expand'></div></div></template>
				</div>
			</div>

			<div id='titlechanger' class='box fade'>
				<b>Let's give your widget a title!</b>
				<form onsubmit='setTitle(titletxt.value);return false;'>
					<input type='text' id='titletxt' name='titletxt' placeholder='My Labeling widget' autofocus='1'>
					<input type='submit' value='Done'>
				</form>
			</div>

			<div id='descriptionchanger' class='box fade nubox fit'>
				<img id="descimage"/>
				<p>Add an Image Description.</p>
				<form class="btn-row sm" onsubmit='setImageDescription(alttxt.value);return false;'>
					<input type='text' id='alttxt' class="nutxt green" required name='alttxt' placeholder='My image description' autofocus='1'>
					<button type='submit' class="nubtn" id='btn-enter-desc'>
						<img src="assets/arrow-right.svg"/>
					</button>
				</form>
			</div>

			<div id='titlebox' class='box fade intro nubox'>
				<h1>Welcome to Labeling</h1>
				<div style="width: 350px; height: 200px; background:#444;"></div>	
				<p>Upload an image, add labeled anchors, then let students match them for a percent accurate grade.</p>
				<div class="btn-row">
					<button type="button" id="tutorial-btn" class="nubtn">Tutorial</button>
					<button type="button" id="letsgo-btn" class="nubtn">Let's go!</button>
				</div>
				<!-- <b>Start by giving your Labeling widget a title</b><br>
				<form onsubmit='setTitle(titletxt.value);return false;'>
					<input type='text' name='titletxt' placeholder='My Labeling widget' autofocus='1'>
					<input type='submit' value='Get Started' id='btn-enter-title'>
				</form> -->
			</div>

			<div id='namebox' class='box fade intro nubox fit'>
				<p>Let's give this Labeling Widget a title!</p>
				<form class="btn-row sm" onsubmit='setTitle(titletxt.value);return false;'>
					<input class="nutxt purple" type='text' name='titletxt' placeholder='My New Widget' autofocus='1'>
					<button type='submit' class="nubtn" id='btn-enter-title'>
						<img src="assets/arrow-right.svg"/>
					</button>
				</form>
			</div>
		</div>
		<!-- INITIALIZE -->
		<script type="text/javascript">
			Materia.CreatorCore.start(Labeling.Creator);
		</script>
	</body>
</html>
