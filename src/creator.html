<!DOCTYPE html>
<html class="">
	<head>
		<title>Labeling Creator</title>
		<meta charset='utf-8' />

		<!-- STYLESHEETS -->
		<link rel='stylesheet' type='text/css' href='creator.css'>
		<link rel='stylesheet' type='text/css' href='https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.10.4/css/jquery.ui.resizable.min.css'>
		<link href='//fonts.googleapis.com/css?family=Anybody:300,400,600,700|Roboto+Slab' rel='stylesheet' type='text/css'>

		<!-- REQUIRED MATERIA JAVASCRIPT -->
		<script src="materia.creatorcore.js"></script>

		<!-- YOUR PREREQUISITES -->
		<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		<script src='//cdnjs.cloudflare.com/ajax/libs/jqueryui/1.10.4/jquery-ui.min.js'></script>

		<!-- MAIN CREATOR SCRIPT -->
		<script src="creator.js"></script>
	</head>
	<body>
		<!-- <div class='sidepanel left'></div>
		<div class='sidepanel right'></div> -->

		<div class='frame' id='frame'>
			<header id='header' aria-label="Header">
				<h1 id='title' role='textbox' tabindex='0' aria-label="Edit title">
					My Labeling Widget
				</h1>
			</header>

			<div class="arrow_box hide">Add Image Description</div>

			<div id='controls'>
				<div id="background-settings" class="color-picker">
					<div class="label-title">
						<span>Background Color</span>
						<div class="overlay-options" aria-label="Background overlay settings">
							<input type="radio" name="overlay" id="normal-overlay" data-type="" checked aria-label="No overlay" title="No overlay"></input>
							<input type="radio" name="overlay"  id="dotted-overlay" data-type="dotted" aria-label="Dotted overlay" title="Dotted overlay"></input>
							<input type="radio" name="overlay"  id="graph-overlay" data-type="graph" aria-label="Grid overlay" title="Grid overlay"></input>
						</div>
					</div>
					<!-- <div class="background-swatch-preferences">
						<input type="radio" id="default-color" name="background-preference" checked />
						<label for="default-color" class="bg-preference">Default Colors</label>

						<input type="radio" id="dynamic-color" name="background-preference" />
						<label for="dynamic-color" class="bg-preference">Dynamic Colors</label>
					</div> -->
					<div class="background-options" aria-label="Background color settings">
						<input type="radio" id="a-toggle" name="background-tone" aria-label="Dark green" checked>
						<label for="a-toggle" class="swatch dark1"></label>
					
						<input type="radio" id="b-toggle" name="background-tone" aria-label="Dark blue">
						<label for="b-toggle" class="swatch dark2"></label>
			
						<input type="radio" id="c-toggle" name="background-tone" aria-label="Mahogany red">
						<label for="c-toggle" class="swatch dark3"></label>
				
						<input type="radio" id="d-toggle" name="background-tone" aria-label="Brick red">
						<label for="d-toggle" class="swatch dark4"></label>
						
						<input type="radio" id="f-toggle" name="background-tone" aria-label="Grey">
						<label for="f-toggle" class="swatch mid2"></label>

						<input type="radio" id="j-toggle" name="background-tone" aria-label="Light grey">
						<label for="j-toggle" class="swatch light2"></label>

						<input type="radio" id="e-toggle" name="background-tone" aria-label="Sand">
						<label for="e-toggle" class="swatch mid"></label>
					
						<input type="radio" id="i-toggle" name="background-tone" aria-label="Light sand">
						<label for="i-toggle" class="swatch light"></label>
					</div>
				</div>
				<hr>
				<div id="label-settings">
					<label class="label-title">Label Color</label>
				  
					<div class="label-options" aria-label="Label color scheme settings">
						<input type="radio" id="a-labeltoggle" name="label-toggle" aria-label="Dark green with white text" checked>
						<label for="a-labeltoggle" class="label-box dark1" data-style="dark1">Aa</label>
						
						<input type="radio" id="b-labeltoggle" name="label-toggle" aria-label="Dark blue with white text">
						<label for="b-labeltoggle" class="label-box dark2" data-style="dark2">Aa</label>
						
						<input type="radio" id="c-labeltoggle" name="label-toggle" aria-label="Mahogany red with white text">
						<label for="c-labeltoggle" class="label-box dark3" data-style="dark3">Aa</label>

						<input type="radio" id="d-labeltoggle" name="label-toggle" aria-label="Brick red with white text">
						<label for="d-labeltoggle" class="label-box dark4" data-style="dark4">Aa</label>
					  
						<input type="radio" id="g-labeltoggle" name="label-toggle" aria-label="Grey with black text">
						<label for="g-labeltoggle" class="label-box mid2" data-style="mid2">Aa</label>
					
						<input type="radio" id="h-labeltoggle" name="label-toggle" aria-label="Light grey with dark green text">
						<label for="h-labeltoggle" class="label-box light2" data-style="light2">Aa</label>
				  
						<input type="radio" id="e-labeltoggle" name="label-toggle" aria-label="Sand with dark green text">
						<label for="e-labeltoggle" class="label-box mid" data-style="mid">Aa</label>
					
						<input type="radio" id="f-labeltoggle" name="label-toggle" aria-label="Light sand with dark green text">
						<label for="f-labeltoggle" class="label-box light" data-style="light">Aa</label>
					</div>
				</div>
				<hr>
				<div id="anchor-settings">
					<label class="label-title">Anchor Settings</label>
					<div id="opacity-number">
						<label class="label-subtitle">Opacity | </label>
						<span id="opacity-value"> 100%</span>
					</div>
					<input
						type="range"
						id="opacity-slider"
						min="0"
						max="100"
						step="1"
						value="100"
						aria-label="Anchor opacity percentage"
					>
				</div>
				<hr>
				<div id="image-settings">
					<label class="label-title">Image Settings</label>
					<div id="edit-image" aria-label="Image display settings">
						<input type='button' value='Choose a different image' data-intro='Choose an image' id='btnChooseImage'>
						<input type='button' id='btnMoveCrop' aria-label="Crop Image">
						<input type='button' id='btnMoveResize' aria-label="Resize Image">
					</div>
					<hr/>
					<label class="label-title">Image Description</label>
					<div id="image-desc" aria-label="Image Description Settings">
						<p id="imagedescription"></p>
						<button id='btnChangeDescription' aria-label="Change Description">
							<img src="assets/pencil.svg"/>
						</button>
					</div>
				</div>
			</div>

			<div id='backgroundcover'></div>
			<div id='controlcover'></div>
			<!-- <input type='button' value='Cancel Move &amp; Resize' id='btnMoveResizeCancel' style='display:none'>
			<input type='button' value='Save Changes' id='btnMoveResizeDone' style='display:none'> -->

			<div id="boardwrapper">
				<div id="board" class="screen board">
					<div id='boardcover'></div>
					<div id='imagewrapper'>
						<img id='image' alt=''>
						<div id="crop"></div>
					</div>

					<div id='inputwrapper'>
						<div id='resizecontrols' style="display: none;">
							<button aria-label="Cancel Move & Resize" id="btnMoveResizeCancel"><img src="assets/x.svg"/></button>
							<button aria-label="Cancel Crop" id="btnCropCancel"><img src="assets/x.svg"/></button>
							<div style="background: #fff; width: 1px;"></div>
							<button aria-label="Save Changes" id="btnMoveResizeDone"><img src="assets/check.svg"/></button>
							<button aria-label="Save Changes" id="btnCropDone"><img src="assets/check.svg"/></button>
						</div>
					</div>
					<svg id="svglayer" viewBox="0 0 605 550" xmlns="http://www.w3.org/2000/svg" x1="0" x2="0" y1="0" y2="1">
						<defs id="defs">
							<linearGradient id="core-gradient">
								<stop class="stop1" offset="0%" />
								<stop class="stop2" offset="100%" />
							</linearGradient>
						</defs>
					</svg>
					<div id='terms'>
						<!-- for some evil reason this breaks if it is not a single line -->
						<template id="term_template"><div><h3 class="label-title-header">Create Label</h3><div class='label-title-header'>Label Title</div><div class='label-input' id='text-input' aria-label="Label Title" tabindex='0' contenteditable='true' onkeypress='return (this.innerText.length <= 400)'></div><div class='alt-text-header'>Anchor Description</div><div class='description-input' id='text-input' contenteditable='true' aria-label="Anchor Description" tabindex='0' onkeypress='return (this.innerText.length <= 400)'></div><button type="button" class='delete' aria-label="Delete Term"><img aria-hidden src="assets/x.svg"/></button><button type="button" class='confirm' aria-label="Confirm Term Changes"><img aria-hidden src="assets/check.svg"/></button></div></template>
					</div>
				</div>
			</div>

			<div id='titlechanger' class='box fade intro nubox fit' aria-label="Widget title editor" inert>
				<p>Let's give this Labeling Widget a title!</p>
				<form class="btn-row sm" onsubmit='setTitle(titletxt.value);return false;'>
					<input class="nutxt purple" type='text' id='titletxt' name='titletxt' aria-label="Title input" placeholder='My Labeling Widget' autofocus='1'>
					<button type='submit' class="nubtn" id='btn-update-title' aria-label="Update title">
						<img src="assets/arrow-right.svg"/>
					</button>
				</form>
			</div>

			<div id='descriptionchanger' class='box fade nubox fit' aria-label="Widget description editor" inert>
				<img id="descimage"/>
				<p>Add an Image Description.</p>
				<form class="btn-row sm" onsubmit='setImageDescription(alttxt.value);return false;'>
					<input type='text' id='alttxt' class="nutxt green" required name='alttxt' aria-label="Description input" placeholder='My image description' autofocus='1'>
					<button type='submit' class="nubtn" id='btn-enter-desc' aria-label="Update description">
						<img src="assets/arrow-right.svg"/>
					</button>
				</form>
			</div>

			<div id='titlebox' class='box fade intro nubox' aria-label="Labeling intro">
				<img src="assets/new_creator_example.png" alt="Image of an example Labeling widget"/>
				<h1>Welcome to Labeling!</h1>
				<p>Upload an image, add labeled anchors, then let students match them for a percent accurate grade.</p>
				<div class="btn-row">
					<button type="button" id="letsgo-btn" class="nubtn">Let's go!</button>
				</div>
			</div>

			<div id='namebox' class='box fade intro nubox fit' aria-label="Widget title editor" inert>
				<p>Let's give this Labeling Widget a title!</p>
				<form class="btn-row sm" onsubmit='setTitle(titletxt.value);return false;'>
					<input class="nutxt purple" type='text' name='titletxt' aria-label="Title input" placeholder='My Labeling Widget' autofocus='1'>
					<button type='submit' class="nubtn" id='btn-enter-title' aria-label="Update title">
						<img src="assets/arrow-right.svg"/>
					</button>
				</form>
			</div>
		</div>
		<!-- INITIALIZE -->
		<script type="text/javascript">
			Materia.CreatorCore.start(Labeling.Creator);
		</script>
	</body>
</html>
